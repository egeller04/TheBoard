<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>The Board — Log In</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#EEF2F9;color:#0B1F3A;font:16px system-ui;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:100%;max-width:420px;background:white;border:1px solid #D2DCEE;border-radius:12px;padding:32px}h1{font-size:32px;margin:0 0 8px}p{color:#5C6B85;line-height:1.5}label{display:block;margin:18px 0 6px}input,button{width:100%;padding:12px;border-radius:6px;font:inherit}input{border:1px solid #D2DCEE;background:#E4EAF6}button{border:0;background:#1D5CD1;color:white;margin-top:20px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.secondary{background:none;color:#1D5CD1;margin-top:8px}#status{min-height:24px;font-size:14px}a{color:#1D5CD1}
</style></head><body><main class="card"><h1>THE BOARD</h1><p id="intro">Log in to see this week's matchup. New members need an invitation.</p>
<form id="authForm"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required maxlength="254">
<label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required maxlength="128">
<button id="submitBtn">Log in</button></form><button class="secondary" id="switchBtn" hidden>Already have an account? Log in</button>
<button class="secondary" id="resetBtn">Forgot password?</button><p id="status" role="status" aria-live="polite"></p>
<script type="module" src="js/login.js"></script></main></body></html>
